name: release

# 推 tag 发版：校验版本 → 装测试依赖 → 测试 → npm publish（trusted publishing）→ GitHub Release。
# npm 与 GitHub Releases 必须同一次都更新：面板的更新提示查的是 GitHub Releases，
# 而用户升级走 npm；两者版本不一致就会出现「提示说有新版、update 却拿不到」。
#
# 依赖现实（勿改回 pnpm install --frozen-lockfile）：
# - 本仓库没有 pnpm-lock.yaml（运行依赖全是宿主提供的 peer，不装进包）；
# - devDependencies 里的 @deepseek-ai/* 是宿主内部包，npm registry 上不存在；
# - 测试只需要 `yaml`（test/expert-manual.mjs 唯一裸导入；node:test 内置）。
# 测试文件里的 profile-redirect loader 会先尝试标准解析（CI 装了 yaml 就走标准路），
# 本机 profile 副本只是开发机兜底。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create 需要
      id-token: write   # npm trusted publishing（OIDC）需要
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # 不配 registry-url：trusted publishing 走 OIDC，不需要 NODE_AUTH_TOKEN。
          # 配了反而会让 npm 去要一个不存在的 token。

      - name: 校验 tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG 与 package.json version $VERSION 不一致"
            exit 1
          fi

      - name: 校验 whats-new 已写当前版本条目
        # 面板的「更新到 vX」提示真源是 lib/whats-new.js，漏写这一条测试会红。
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! grep -q "version: '$VERSION'" lib/whats-new.js; then
            echo "::error::lib/whats-new.js 缺少 version: '$VERSION' 条目"
            exit 1
          fi

      - name: 校验 release notes 稿子存在
        # 稿子必须放 .github/release-notes/，不能放 docs/（docs 会随包发布到 npm）。
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ ! -f ".github/release-notes/v$VERSION.md" ]; then
            echo "::error::缺少 .github/release-notes/v$VERSION.md"
            exit 1
          fi

      - name: 安装测试依赖（仅 yaml）
        run: |
          set -euo pipefail
          mkdir -p node_modules
          npm install --no-save --prefix "$PWD" yaml@2

      - name: 测试门槛（专家市场写链 + 一键升级判据）
        run: npm test

      - name: npm publish（trusted publishing）
        # 幂等守卫：版本已在 npm 上就跳过，不报错。
        # 为什么需要：① 重跑同一个 tag 时不再因「版本已存在」把后续 GitHub Release 步骤连带 skip；
        # ② trusted publishing 尚未在该包上配置完成前，发布由维护者本地 `npm publish` 完成，
        # 此后 CI 走到这一步应当是「确认已发布」而不是失败。
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-armory@$VERSION" version >/dev/null 2>&1; then
            echo "npm 上已有 dsh-armory@$VERSION，跳过发布"
            exit 0
          fi
          npm publish --provenance --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NOTES=".github/release-notes/v$VERSION.md"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --notes-file "$NOTES"
          else
            gh release create "v$VERSION" --title "dsh-armory v$VERSION" --notes-file "$NOTES"
          fi
